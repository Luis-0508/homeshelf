name: Pull request labels

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ensure repository labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          ensure_label() {
            gh label create "$1" --color "$2" --description "$3" --force
          }

          ensure_label "source" "1D76DB" "Application or library source changes"
          ensure_label "tests" "C5DEF5" "Automated tests or test tooling"
          ensure_label "documentation" "0075CA" "Documentation changes"
          ensure_label "assets" "A371F7" "Images, media, fonts, or other project assets"
          ensure_label "dependencies" "0366D6" "Dependency manifest, lockfile, or Dependabot changes"
          ensure_label "deployment" "0052CC" "Docker, deployment, or environment configuration"
          ensure_label "ci" "000000" "GitHub Actions or repository automation changes"
          ensure_label "bug" "D73A4A" "Something is not working as intended"
          ensure_label "enhancement" "84B6EB" "Feature request or improvement"

      - name: Apply labels from changed files
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
