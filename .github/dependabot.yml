# Keep GitHub Actions updates active for every repository.
# Add one update block per project package ecosystem (npm, pip, gomod, docker, etc.)
# as soon as that ecosystem is introduced. Use the same 7-day cron pattern and
# open-pull-requests-limit: 100 so updates remain visible.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 100
    commit-message:
      prefix: ci
